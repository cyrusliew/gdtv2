name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_TINA_CLIENT_ID: ${{ vars.TINA_CLIENT_ID }}
      TINA_TOKEN: ${{ secrets.TINA_TOKEN }}
      TINA_BASE_PATH: ${{ vars.TINA_BASE_PATH }}
      NEXT_PUBLIC_MEDIA_API_URL: ${{ vars.MEDIA_API_URL }}
      MEDIA_API_URL: ${{ vars.MEDIA_API_URL }}
      CI_UPLOAD_TOKEN: ${{ secrets.R2_CI_UPLOAD_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Ensure ffmpeg is available for video optimization
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Cache generated media assets
        uses: actions/cache@v4
        with:
          path: public/assets/.generated
          key: generated-media-${{ hashFiles('public/assets/**', 'scripts/process-media.js') }}
          restore-keys: |
            generated-media-

      - name: Build
        run: pnpm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
